.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}

#answer{width:min(100%,560px);font-size:22px;text-align:center;letter-spacing:.4px}
.feedback{min-height:30px;margin:12px 0;font-weight:650}.ok{color:#16834a}.ng{color:#c03935}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.small{font-size:13px}.hidden{display:none}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #edf0f5;text-align:left}th{color:#68738a}

</style>
</head>

<main>
  <div class="top"><div><h1>英単語タイピング練習</h1><div class="muted">日本語を見て、英単語を正確にタイピングしよう。</div></div><div class="small muted">Vocabulary Catcher No.3・No.4</div></div>
  <section class="panel">
    <div class="controls">
      <select id="range"><option value="all">No.3＋No.4 全範囲</option><option value="3">No.3</option><option value="4">No.4</option></select>
      <select id="mode"><option value="random">ランダム出題</option><option value="order">番号順</option><option value="wrong">間違えた単語だけ</option></select>
      <button id="restart">出題をリセット</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="muted small">今回の正解</span><b id="correct">0</b></div>
      <div class="stat"><span class="muted small">回答数</span><b id="total">0</b></div>
      <div class="stat"><span class="muted small">正答率</span><b id="rate">0%</b></div>
      <div class="stat"><span class="muted small">残り</span><b id="left">0</b></div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="prompt">
      <div class="num" id="label">No.3 / No.4</div>
      <div class="meaning" id="meaning">読み込み中…</div>
      <input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここに英単語を入力">
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row">
        <button class="primary" id="check">答え合わせ（Enter）</button>
        <button id="skip">わからない・次へ</button>
      </div>
    </div>
    <div class="small muted">※ 大文字・小文字は区別しません。スペースや記号は登録された表記どおりに入力してください。熟語もまとめて入力します。</div>
  </section>
  <section class="panel" style="margin-top:16px">
    <div class="top"><strong>今回の結果</strong><button id="showWrong">間違えた単語を見る</button></div>
    <div id="wrongList" class="hidden"></div>
    <div class="small muted">学習記録はこのブラウザー内に保存されます。</div>
  </section>
</main>

let queue=[], index=0, correct=0, answered=0, wrong=new Set(), locked=false;
const $=id=>document.getElementById(id);
function normalize(s){return s.trim().toLowerCase().replace(/[〜～]/g,"~").replace(/\s+/g," ")}
function selected(){let r=$("range").value;return words.filter(x=>r==="all"||String(x.s)===r)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){let pool=selected();if($("mode").value==="wrong")pool=pool.filter(x=>wrong.has(x.s+"-"+x.n));queue=$("mode").value==="order"?pool.slice():shuffle(pool.slice());index=0;correct=0;answered=0;locked=false;render()}
function render(){let done=index>=queue.length;$("meaning").textContent=done?"終了！":queue[index].m;$("label").textContent=done?"おつかれさま":`No.${queue[index].s}・No.${queue[index].n}番`; $("answer").value="";$("answer").disabled=done;$("check").disabled=done;$("skip").disabled=done;$("feedback").textContent=done?`今回の正解：${correct} / ${answered}　正答率：${answered?Math.round(correct/answered*100):0}%`:"";$("feedback").className="feedback";$("correct").textContent=correct;$("total").textContent=answered;$("rate").textContent=(answered?Math.round(correct/answered*100):0)+"%";$("left").textContent=queue.length-index;$("bar").style.width=(queue.length?index/queue.length*100:100)+"%";if(!done)$("answer").focus()}
function check(){if(index>=queue.length||locked)return;let q=queue[index],v=$("answer").value;if(!v.trim())return;answered++;if(normalize(v)===normalize(q.w)){correct++;wrong.delete(q.s+"-"+q.n);$("feedback").textContent="正解！";$("feedback").className="feedback ok";locked=true;setTimeout(()=>{index++;locked=false;render()},550)}else{$("feedback").textContent=`不正解。正解：${q.w}`;$("feedback").className="feedback ng";wrong.add(q.s+"-"+q.n);locked=true;setTimeout(()=>{index++;locked=false;render()},1300)}save()}
function skip(){if(index>=queue.length)return;wrong.add(queue[index].s+"-"+queue[index].n);index++;render();save()}
function save(){try{localStorage.setItem("vocabTypingWrong",JSON.stringify([...wrong]))}catch(e){}}
try{wrong=new Set(JSON.parse(localStorage.getItem("vocabTypingWrong")||"[]"))}catch(e){}
$("check").addEventListener("click",check);$("skip").addEventListener("click",skip);$("restart").addEventListener("click",start);$("range").addEventListener("change",start);$("mode").addEventListener("change",start);$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
$("showWrong").addEventListener("click",()=>{let box=$("wrongList");box.classList.toggle("hidden");let list=words.filter(x=>wrong.has(x.s+"-"+x.n));box.innerHTML=list.length?`<table><thead><tr><th>範囲</th><th>日本語</th><th>正解</th></tr></thead><tbody>${list.map(x=>`<tr><td>No.${x.s} ${x.n}</td><td>${x.m}</td><td>${x.w}</td></tr>`).join("")}</tbody></table>`:"<p>間違えた単語はまだありません。</p>"});
